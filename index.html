<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scramjet STATIC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <script src="./bare-mux/bare-mux.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; background: #000; font-family: 'Roboto', sans-serif; color: #fff; }
      #home { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 12vh; background: #000; z-index: 10; transition: opacity 0.18s ease; }
      #home.hidden { opacity: 0; pointer-events: none; }
      .title { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 300; letter-spacing: 0.04em; white-space: nowrap; margin-bottom: 2.2rem; text-shadow: 0 0 40px rgba(255,255,255,0.18); }
      .title span { font-weight: 500; }
      .bar-wrap { width: min(600px, 88vw); position: relative; }
      .bar-wrap input { width: 100%; padding: 0.85rem 3rem 0.85rem 1.25rem; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); color: #fff; font-family: 'Roboto', sans-serif; font-size: 1rem; font-weight: 300; outline: none; transition: border-color 0.2s, background 0.2s; backdrop-filter: blur(6px); }
      .bar-wrap input::placeholder { color: rgba(255,255,255,0.38); }
      .bar-wrap input:focus { border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.1); }
      .bar-wrap button { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0.25rem; display: flex; align-items: center; color: rgba(255,255,255,0.5); transition: color 0.2s; }
      .bar-wrap button:hover { color: #fff; }
      #status { margin-top: 1rem; font-size: 0.78rem; color: rgba(255,255,255,0.3); letter-spacing: 0.03em; min-height: 1.2em; text-align: center; }

      /* ── WISP settings panel ─────────────────────────────────────── */
      #wisp-panel {
        width: min(600px, 88vw);
        margin-top: 1.4rem;
        background: rgba(126,200,255,0.1);
        border: 1.5px solid rgba(126,200,255,0.35);
        border-radius: 14px;
        padding: 0.85rem 1rem;
      }

      #wisp-panel .wisp-label {
        font-size: 0.72rem;
        font-weight: 500;
        color: #fff;
        letter-spacing: 0.04em;
        margin-bottom: 0.5rem;
      }

      #wisp-panel .wisp-row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      #wisp-url-input {
        flex: 1;
        min-width: 0;
        background: rgba(0,0,0,0.35);
        border: 1px solid rgba(126,200,255,0.3);
        border-radius: 999px;
        color: #cfe9ff;
        font-family: 'Roboto', sans-serif;
        font-size: 0.78rem;
        padding: 0.5rem 0.9rem;
        outline: none;
        transition: border-color 0.15s;
      }
      #wisp-url-input:focus { border-color: #7ec8ff; }
      #wisp-url-input::selection { background: #1a6abf; color: #fff; }

      .wisp-btn {
        flex-shrink: 0;
        background: #4a9eff;
        color: #06121f;
        border: none;
        font-family: 'Roboto', sans-serif;
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.03em;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s, transform 0.08s;
      }
      .wisp-btn:hover { background: #6ab0ff; }
      .wisp-btn:active { transform: scale(0.95); }
      .wisp-btn.reset { background: #3a7fd6; }
      .wisp-btn.reset:hover { background: #5590dd; }
      .wisp-btn.save { background: #e5484d; color: #fff; }
      .wisp-btn.save:hover { background: #f16469; }

      /* Divider line between WISP URL and transport method sections */
      .wisp-divider {
        height: 1px;
        background: rgba(126,200,255,0.25);
        margin: 0.85rem 0;
        width: 100%;
      }

      /* Transport method toggle — two pill buttons side by side */
      .transport-toggle {
        flex: 1;
        display: flex;
        gap: 0.4rem;
        min-width: 0;
      }

      .transport-opt {
        flex: 1;
        min-width: 0;
        background: rgba(0,0,0,0.35);
        border: 1.5px solid rgba(126,200,255,0.3);
        border-radius: 999px;
        color: #8fbde0;
        font-family: 'Roboto', sans-serif;
        font-size: 0.72rem;
        font-weight: 500;
        padding: 0.5rem 0.7rem;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .transport-opt .suggested {
        font-weight: 400;
        opacity: 0.7;
        font-size: 0.68rem;
      }

      .transport-opt:hover {
        border-color: rgba(126,200,255,0.6);
        color: #cfe9ff;
      }

      .transport-opt.active {
        background: #4a9eff;
        border-color: #4a9eff;
        color: #06121f;
      }
      .transport-opt.active .suggested {
        color: #06121f;
        opacity: 0.75;
      }

      /* ── "wisp server set!" toast ────────────────────────────────── */
      #wisp-toast {
        position: fixed;
        bottom: -60px;
        left: 1.2rem;
        background: #4a9eff;
        color: #06121f;
        font-family: 'Roboto', sans-serif;
        font-size: 0.82rem;
        font-weight: 500;
        letter-spacing: 0.03em;
        padding: 0.65rem 1.4rem;
        border-radius: 999px;
        box-shadow: 0 4px 18px rgba(74,158,255,0.4);
        z-index: 50;
        transition: bottom 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.3s ease, transform 0.3s ease;
        opacity: 0;
        transform: translateX(-30px);
      }
      #wisp-toast.visible {
        bottom: 1.2rem;
        opacity: 1;
        transform: translateX(0);
      }
      #wisp-toast.leaving {
        opacity: 0;
        transform: translateX(-40px);
      }
      #browser { position: fixed; inset: 0; width: 100%; height: 100%; border: none; background: #111; z-index: 5; display: none; }
      #browser.visible { display: block; }

      /* Floating action pill — black rounded bar, bottom center.
         Reload button in front (left), Home button behind (right). */
      #fab-bar {
        position: fixed;
        bottom: 1.1rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: none;
        align-items: center;
        gap: 0.4rem;
        background: rgba(0,0,0,0.75);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 999px;
        padding: 0.3rem;
        backdrop-filter: blur(8px);
      }
      #fab-bar.visible { display: flex; }

      .fab-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #fff;
        transition: background 0.15s, transform 0.1s;
        flex-shrink: 0;
      }
      .fab-btn:hover { background: rgba(255,255,255,0.12); }
      .fab-btn:active { transform: scale(0.92); }

      /* Yellow reload/network toast — same shape as wisp toast, different side */
      #reload-toast {
        position: fixed;
        bottom: -60px;
        right: 1.2rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: #f5c518;
        color: #1a1400;
        font-family: 'Roboto', sans-serif;
        font-size: 0.82rem;
        font-weight: 500;
        letter-spacing: 0.03em;
        padding: 0.65rem 1.4rem;
        border-radius: 999px;
        box-shadow: 0 4px 18px rgba(245,197,24,0.4);
        z-index: 50;
        transition: bottom 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.3s ease, transform 0.3s ease;
        opacity: 0;
        transform: translateX(30px);
        white-space: nowrap;
      }
      #reload-toast.visible {
        bottom: 1.2rem;
        opacity: 1;
        transform: translateX(0);
      }
      #reload-toast.leaving {
        opacity: 0;
        transform: translateX(40px);
      }
      #reload-toast .dots span {
        opacity: 0.25;
        transition: opacity 0.15s;
      }
      #reload-toast .dots span.active { opacity: 1; }

      /* Slim baby-blue loading bar, top of the iframe */
      #load-bar {
        position: fixed;
        top: 0; left: 0;
        height: 3px;
        width: 0%;
        background: #7ec8ff;
        box-shadow: 0 0 6px rgba(126,200,255,0.6);
        z-index: 25;
        opacity: 0;
        border-radius: 0 2px 2px 0;
      }
    </style>
  </head>
  <body>
    <div id="home">
      <h1 class="title">Scramjet <span>STATIC</span></h1>
      <div class="bar-wrap">
        <input id="searchbar" type="text" placeholder="Browse the web" autocomplete="off" autocorrect="off" spellcheck="false" />
        <button id="go-btn" aria-label="Go">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>
      <p id="status">Initialising…</p>

      <!-- WISP server settings panel -->
      <div id="wisp-panel">
        <div class="wisp-label">WISP SERVER</div>
        <div class="wisp-row">
          <input id="wisp-url-input" type="text" autocomplete="off" spellcheck="false" />
          <button id="wisp-set-btn" class="wisp-btn">Set</button>
          <button id="wisp-reset-btn" class="wisp-btn reset">Reset</button>
        </div>

        <div class="wisp-divider"></div>

        <div class="wisp-label">TRANSPORT METHOD</div>
        <div class="wisp-row">
          <div class="transport-toggle">
            <button id="transport-libcurl-btn" class="transport-opt active" data-transport="libcurl">
              libcurl <span class="suggested">(default, suggested)</span>
            </button>
            <button id="transport-epoxy-btn" class="transport-opt" data-transport="epoxy">
              epoxy
            </button>
          </div>
          <button id="transport-save-btn" class="wisp-btn save">Save</button>
          <button id="transport-reset-btn" class="wisp-btn reset">Reset</button>
        </div>
      </div>
    </div>

    <!-- "wisp server set!" toast -->
    <div id="wisp-toast">wisp server set!</div>

    <iframe
      id="browser"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"
      allow="autoplay; fullscreen"
    ></iframe>

    <!-- Baby blue loading bar -->
    <div id="load-bar"></div>

    <!-- Floating action pill: reload (front/left), home (back/right) -->
    <div id="fab-bar">
      <div id="reload-fab" class="fab-btn" title="Reload" aria-label="Reload page">
        <svg id="reload-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </div>
      <div id="home-fab" title="Home" aria-label="Go home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
    </div>

    <!-- Yellow reload/network status toast -->
    <div id="reload-toast"></div>

    <script type="module">
      // IMMEDIATE marker — if you don't see "Script started..." appear
      // instantly on page load, the module script is not executing at all,
      // which means this is a deployment/caching issue, not a logic bug.
      document.getElementById('status').textContent = 'Script started — build v2.1'

      const status  = document.getElementById('status')
      const home    = document.getElementById('home')

      // Global safety net — if ANYTHING throws anywhere in this script,
      // show it directly on screen instead of leaving a silent stuck state
      window.addEventListener('error', (e) => {
        status.style.color = '#f87171'
        status.textContent = 'Fatal error: ' + (e.error?.message || e.message)
        console.error('[Scramjet STATIC] Uncaught error:', e.error || e.message)
      })
      window.addEventListener('unhandledrejection', (e) => {
        status.style.color = '#f87171'
        status.textContent = 'Fatal error: ' + (e.reason?.message || e.reason)
        console.error('[Scramjet STATIC] Unhandled rejection:', e.reason)
      })

      const frame   = document.getElementById('browser')
      const bar     = document.getElementById('searchbar')
      const homeFab = document.getElementById('home-fab')
      const fabBar = document.getElementById('fab-bar')
      const reloadFab = document.getElementById('reload-fab')
      const reloadIcon = document.getElementById('reload-icon')
      const reloadToast = document.getElementById('reload-toast')
      const loadBar = document.getElementById('load-bar')
      const wispInput   = document.getElementById('wisp-url-input')
      const wispSetBtn  = document.getElementById('wisp-set-btn')
      const wispResetBtn = document.getElementById('wisp-reset-btn')
      const wispToast   = document.getElementById('wisp-toast')
      const transportLibcurlBtn = document.getElementById('transport-libcurl-btn')
      const transportEpoxyBtn   = document.getElementById('transport-epoxy-btn')
      const transportSaveBtn   = document.getElementById('transport-save-btn')
      const transportResetBtn  = document.getElementById('transport-reset-btn')

      // ── Loading bar — fake but convincing multi-stage progress ────────
      // Fast burst at the start, slows down as it approaches the "end",
      // then snaps to 100% and fades when the iframe actually fires load.
      let loadBarTimer = null
      let loadBarStep = null

      function startLoadBar() {
        clearTimeout(loadBarTimer)
        clearInterval(loadBarStep)
        loadBar.style.transition = 'none'
        loadBar.style.width = '0%'
        loadBar.style.opacity = '1'

        // Force reflow so the transition below actually applies
        void loadBar.offsetWidth

        let pct = 0
        loadBar.style.transition = 'width 0.2s linear'
        loadBarStep = setInterval(() => {
          // Slow down as we approach 90% — never quite finishes on its own
          const remaining = 90 - pct
          const step = Math.max(remaining * 0.08, 0.4)
          pct = Math.min(pct + step, 90)
          loadBar.style.width = pct + '%'
          if (pct >= 90) clearInterval(loadBarStep)
        }, 120)
      }

      function finishLoadBar() {
        clearInterval(loadBarStep)
        loadBar.style.transition = 'width 0.25s ease'
        loadBar.style.width = '100%'
        loadBarTimer = setTimeout(() => {
          loadBar.style.transition = 'opacity 0.3s ease'
          loadBar.style.opacity = '0'
          loadBarTimer = setTimeout(() => {
            loadBar.style.width = '0%'
          }, 300)
        }, 200)
      }

      let browsing = false

      const BASE = new URL('./', document.baseURI).pathname
      const DEFAULT_WISP = 'wss://anura.pro/wisp/'
      const DEFAULT_TRANSPORT = 'libcurl'
      let currentConn = null // set once bare-mux connection object exists
      let currentTransport = DEFAULT_TRANSPORT // 'libcurl' or 'epoxy'
      let pendingTransport = DEFAULT_TRANSPORT // what's selected in UI but not yet saved

      function transportPath(method) {
        return BASE + 'transport/' + method + '.mjs'
      }

      function getSavedTransport() {
        try {
          const saved = localStorage.getItem('fish-transport')
          return (saved === 'epoxy' || saved === 'libcurl') ? saved : DEFAULT_TRANSPORT
        } catch (e) {
          console.warn('[Scramjet STATIC] localStorage unavailable, using default transport:', e)
          return DEFAULT_TRANSPORT
        }
      }

      function saveTransportChoice(method) {
        try {
          localStorage.setItem('fish-transport', method)
        } catch (e) {
          console.warn('[Scramjet STATIC] Could not persist transport choice:', e)
        }
      }

      function setTransportUI(method) {
        pendingTransport = method
        transportLibcurlBtn.classList.toggle('active', method === 'libcurl')
        transportEpoxyBtn.classList.toggle('active', method === 'epoxy')
      }

      function getSavedWisp() {
        try {
          return localStorage.getItem('fish-wisp') || DEFAULT_WISP
        } catch (e) {
          console.warn('[Scramjet STATIC] localStorage unavailable, using default WISP:', e)
          return DEFAULT_WISP
        }
      }

      function saveWisp(url) {
        try {
          localStorage.setItem('fish-wisp', url)
        } catch (e) {
          console.warn('[Scramjet STATIC] Could not persist WISP choice:', e)
        }
      }

      function showToast() {
        clearTimeout(showToast._hideTimer)
        clearTimeout(showToast._cleanupTimer)
        wispToast.classList.remove('leaving')
        // Force reflow so re-triggering the animation works if clicked twice fast
        void wispToast.offsetWidth
        wispToast.classList.add('visible')
        showToast._hideTimer = setTimeout(() => {
          wispToast.classList.add('leaving')
          wispToast.classList.remove('visible')
          showToast._cleanupTimer = setTimeout(() => {
            wispToast.classList.remove('leaving')
          }, 350)
        }, 4000)
      }

      function normalizeWispUrl(raw) {
        let url = raw.trim()
        if (!url) return url
        // Add wss:// if no protocol was typed at all
        if (!/^wss?:\/\//i.test(url)) {
          url = 'wss://' + url
        }
        // Ensure trailing slash — bare-mux/wisp-js expects the path to end in /
        if (!url.endsWith('/')) {
          url += '/'
        }
        return url
      }

      async function applyWisp(url, { persist = true } = {}) {
        if (!currentConn) {
          wispSetBtn.textContent = 'Not ready yet…'
          setTimeout(() => { wispSetBtn.textContent = 'Set' }, 1800)
          return
        }
        wispSetBtn.disabled = true
        wispResetBtn.disabled = true
        const originalText = wispSetBtn.textContent
        wispSetBtn.textContent = 'Setting…'
        try {
          await currentConn.setTransport(
            transportPath(currentTransport),
            [{ wisp: url }]
          )
          if (persist) saveWisp(url)
          wispInput.value = url
          wispSetBtn.textContent = 'Set'
          showToast()
        } catch (err) {
          // Surface the real error directly on the button instead of
          // silently failing — this tells us exactly what's wrong
          wispSetBtn.textContent = 'Failed!'
          wispToast.textContent = 'Error: ' + err.message
          wispToast.style.background = '#ff6b6b'
          showToast()
          setTimeout(() => {
            wispToast.textContent = 'wisp server set!'
            wispToast.style.background = ''
          }, 4200)
          console.error('[Scramjet STATIC] setTransport failed:', err)
          setTimeout(() => { wispSetBtn.textContent = originalText }, 2000)
        } finally {
          wispSetBtn.disabled = false
          wispResetBtn.disabled = false
        }
      }

      wispSetBtn.addEventListener('click', async () => {
